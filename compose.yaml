services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  collab:
    build:
      context: .
      dockerfile: collab-server/Dockerfile
    ports:
      - "1234:1234"
    environment:
      # backend runs on the host, not in this compose file yet - override if
      # backend/frontend get containerized here later.
      DJANGO_API_URL: http://host.docker.internal:8000/api
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

volumes:
  postgres_data:
